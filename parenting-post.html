<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="MomCare 육아 가이드와 생활 속 육아 팁을 만나보세요.">
  <title>육아 글 | MomCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { primary: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }, secondary: { 500: '#ec4899' } },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }}
    };
  </script>
  <style>
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .momcare-markdown h1,.momcare-markdown h2,.momcare-markdown h3 { margin: 1.8em 0 .65em; color: inherit; font-weight: 800; line-height: 1.35; }
    .momcare-markdown h1 { font-size: 1.8rem; }
    .momcare-markdown h2 { font-size: 1.45rem; }
    .momcare-markdown h3 { font-size: 1.2rem; }
    .momcare-markdown p { margin: 1em 0; }
    .momcare-markdown ul,.momcare-markdown ol { margin: 1em 0; padding-left: 1.5rem; }
    .momcare-markdown ul { list-style: disc; }
    .momcare-markdown ol { list-style: decimal; }
    .momcare-markdown li { margin: .35em 0; padding-left: .15rem; }
    .momcare-markdown blockquote { margin: 1.25em 0; border-left: 3px solid #a5b4fc; padding: .25rem 0 .25rem 1rem; color: #64748b; }
    .momcare-markdown a { color: #4f46e5; text-decoration: underline; text-underline-offset: 3px; }
    .momcare-markdown pre { overflow-x: auto; margin: 1.2em 0; border-radius: 1rem; background: #0f172a; padding: 1rem; color: #e2e8f0; font-size: .85rem; }
    .momcare-markdown code { border-radius: .3rem; background: #f1f5f9; padding: .1rem .3rem; font-size: .9em; }
    .momcare-markdown pre code { background: transparent; padding: 0; }
    .momcare-markdown hr { margin: 2rem 0; border-color: #e2e8f0; }
    .momcare-markdown img { max-width: 100%; height: auto; border-radius: 1rem; }
    html.dark .momcare-markdown code { background: #334155; color: #e2e8f0; }
    html.dark .momcare-markdown blockquote { color: #94a3b8; }
    html.dark .momcare-markdown hr { border-color: #334155; }
  </style>
</head>
<body data-posts-page="detail" class="min-h-screen bg-slate-50 pb-10 text-slate-800 transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">
  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur-md transition-colors dark:border-slate-700 dark:bg-slate-800/90">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-4">
      <a href="./" class="flex shrink-0 items-center gap-2" aria-label="MomCare 홈">
        <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-500 to-pink-500 text-xl font-bold text-white shadow-md">🌙</span>
        <span><span class="block bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-lg font-bold leading-none text-transparent dark:from-indigo-400 dark:to-pink-400">맘케어</span><span class="mt-1 block text-[10px] font-medium text-slate-400">MomCare Hub</span></span>
      </a>
      <div class="flex items-center gap-2">
        <select id="postsLangSelect" onchange="changePostsLanguage(this.value)" aria-label="Language / 언어 선택" class="max-w-[126px] cursor-pointer rounded-full border border-slate-200 bg-slate-100 px-2 py-1.5 text-xs font-semibold text-slate-700 focus:outline-none dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200">
          <option value="ko">한국어 🇰🇷</option><option value="ja">日本語 🇯🇵</option><option value="en">English 🇺🇸</option>
        </select>
        <button onclick="togglePostsTheme()" class="flex items-center gap-2 rounded-full bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-200 dark:bg-slate-700 dark:text-amber-300 dark:hover:bg-slate-600" aria-label="테마 전환">
          <i class="fa-solid fa-moon text-indigo-500 dark:text-amber-300"></i><span id="postsThemeText" class="hidden sm:inline">야간 모드</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 pb-10 pt-7 sm:pt-10">
    <nav class="mb-6 flex flex-wrap items-center gap-2 text-xs font-medium text-slate-400" aria-label="Breadcrumb">
      <a href="./" id="postsBackHome" class="transition hover:text-indigo-600">메인으로</a>
      <i class="fa-solid fa-chevron-right text-[9px]"></i>
      <a id="postsBackAll" href="parenting-posts.html?lang=ko" class="transition hover:text-indigo-600">육아 글 전체 보기</a>
      <i class="fa-solid fa-chevron-right text-[9px]"></i>
      <span id="breadcrumbPosts" class="max-w-[55vw] truncate text-slate-500 dark:text-slate-400">게시글</span>
    </nav>

    <div id="allParentingPostsLoading" class="py-16 text-center text-sm text-slate-400" role="status" aria-live="polite">
      <span class="mr-2 inline-block h-4 w-4 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600 align-[-3px]"></span><span>게시글을 불러오는 중이에요…</span>
    </div>
    <div id="allParentingPostsStatus" class="hidden py-8 text-center text-sm text-slate-400" role="status" aria-live="polite"></div>
    <div id="parentingPostDetail" class="hidden"></div>

    <div class="mt-8 rounded-2xl border border-indigo-100 bg-indigo-50/70 p-4 text-xs leading-6 text-indigo-700 dark:border-slate-700 dark:bg-slate-800 dark:text-indigo-200">
      <i class="fa-solid fa-heart mr-1.5 text-pink-500"></i><span id="postsFooterNote">아이마다 성장 속도는 달라요. 건강·의료 관련 내용은 전문가의 안내와 함께 확인해 주세요.</span>
    </div>
  </main>
  <footer class="border-t border-slate-200 py-6 text-center text-[11px] text-slate-400 dark:border-slate-800">© MomCare · Grow together, one little step at a time.</footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="parenting-posts.js"></script>
  <script>
    (function () {
      const copy = {
        ko: { crumb: '육아 글', all: '육아 글 전체 보기', note: '아이마다 성장 속도는 달라요. 건강·의료 관련 내용은 전문가의 안내와 함께 확인해 주세요.', themeDark: '야간 모드', themeLight: '낮 모드' },
        ja: { crumb: '子育て記事', all: '子育て記事一覧', note: '成長のペースには個人差があります。健康・医療に関する内容は専門家にもご相談ください。', themeDark: 'ダークモード', themeLight: 'ライトモード' },
        en: { crumb: 'Parenting article', all: 'All parenting articles', note: 'Every child grows at their own pace. Please consult a qualified professional for health or medical concerns.', themeDark: 'Dark mode', themeLight: 'Light mode' }
      };
      function apply(lang) {
        const t = copy[lang] || copy.ko;
        const crumb = document.getElementById('breadcrumbPosts');
        if (crumb && !new URLSearchParams(location.search).get('id')) crumb.textContent = t.crumb;
        const all = document.getElementById('postsBackAll'); if (all) { all.textContent = t.all; all.href = 'parenting-posts.html?lang=' + encodeURIComponent(lang); }
        const note = document.getElementById('postsFooterNote'); if (note) note.textContent = t.note;
        const dark = document.documentElement.classList.contains('dark');
        const theme = document.getElementById('postsThemeText'); if (theme) theme.textContent = dark ? t.themeLight : t.themeDark;
      }
      window.addEventListener('momcare:languagechange', function (event) {
        const lang = event && event.detail && event.detail.lang ? event.detail.lang : 'ko';
        apply(lang);
      });
      document.addEventListener('DOMContentLoaded', function () {
        let lang = new URLSearchParams(location.search).get('lang');
        try { lang = lang || localStorage.getItem('momcare_lang') || 'ko'; } catch (_) { lang = lang || 'ko'; }
        try { if (localStorage.getItem('momcare_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (_) { /* Storage may be disabled. */ }
        apply(lang);
        window.dispatchEvent(new CustomEvent('momcare:languagechange', { detail: { lang: lang } }));
      });
    })();
  </script>
</body>
</html>
